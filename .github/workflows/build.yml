name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x gradlew

      - run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: landgrab
          path: build/libs/*.jar
