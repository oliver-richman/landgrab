plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def modules = [
	'fabric-transitive-access-wideners-v1',
	'fabric-api-base',
	'fabric-resource-loader-v0',
	'fabric-resource-loader-v1',
	'fabric-lifecycle-events-v1',
	'fabric-networking-api-v1',
	'fabric-screen-api-v1',
	'fabric-key-mapping-api-v1',
	'fabric-command-api-v2',
	'fabric-events-interaction-v0',
	'fabric-entity-events-v1',
	'fabric-item-api-v1',
	'fabric-registry-sync-v0',
	'fabric-game-rule-api-v1',
	'fabric-rendering-v1'
]

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modules.each { module ->
		implementation include(fabricApi.module(module, project.fabric_api_version))
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.java_version as int)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = project.java_version as int
	options.encoding = 'UTF-8'
}
